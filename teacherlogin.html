<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoMaster – Teacher Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #e8edf4;
            font-family: 'Nunito', sans-serif;
        }

        .signin-page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .signin-card {
            position: relative;
            width: 100%;
            max-width: 860px;
            height: min(560px, 92vh);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
            display: flex;
        }

        /* ── Left form panel ── */
        .sc-form-panel {
            width: 52%;
            background: #fff;
            padding: 44px 48px 36px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            animation: slideInLeft 0.7s cubic-bezier(.23, 1, .32, 1) both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ── Right branding panel ── */
        .sc-right {
            flex: 1;
            background: #2563eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 32px 32px 36px;
            overflow: hidden;
            position: relative;
            animation: fadeInScale 0.8s cubic-bezier(.23, 1, .32, 1) 0.15s both;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.88);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .sc-right::before {
            content: '';
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .sc-right::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            top: 10%;
            left: 5%;
            pointer-events: none;
        }

        /* ── Brand ── */
        .sc-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .sc-brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sc-brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sc-brand-name {
            font-size: 1rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        /* ── Teacher badge ── */
        .teacher-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            border: 1.5px solid #bfdbfe;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 14px;
        }

        .teacher-badge svg {
            width: 12px;
            height: 12px;
            color: #2563eb;
        }

        .sc-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .sc-subtitle {
            font-size: 0.82rem;
            color: #6b7280;
            margin-bottom: 24px;
        }

        /* ── Fields ── */
        .sc-field {
            margin-bottom: 14px;
        }

        .sc-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 5px;
        }

        .sc-field input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.92rem;
            color: #1a1a2e;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sc-field input::placeholder {
            color: #9ca3af;
        }

        .sc-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* ── Options row ── */
        .sc-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            font-size: 0.82rem;
        }

        .sc-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #374151;
            cursor: pointer;
            user-select: none;
        }

        .sc-options input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .sc-options a {
            color: #6b7280;
            text-decoration: none;
            font-weight: 600;
        }

        .sc-options a:hover {
            text-decoration: underline;
        }

        /* ── Login button ── */
        .sc-btn-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .sc-btn-login:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        .sc-btn-login svg {
            width: 16px;
            height: 16px;
        }

        /* ── Error message ── */
        .sc-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 14px;
        }

        .sc-error.show {
            display: block;
        }

        /* ── Right panel internals ── */
        .sc-logo-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .sc-logo-wrap img {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.3));
            animation: pulseGlow 3.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.28));
            }

            50% {
                filter: drop-shadow(0 8px 48px rgba(255, 255, 255, 0.22));
            }
        }

        .sc-bottom {
            z-index: 2;
            align-self: flex-start;
            width: 100%;
        }

        .sc-tagline h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 3px;
        }

        .sc-tagline p {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .sc-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }

        .sc-back:hover {
            color: rgba(255, 255, 255, 0.95);
        }

        .sc-back svg {
            width: 13px;
            height: 13px;
        }

        /* ── Signup link ── */
        .sc-signup-link {
            text-align: center;
            font-size: 0.82rem;
            color: #6b7280;
            margin-top: 16px;
        }

        .sc-signup-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .sc-signup-link a:hover {
            text-decoration: underline;
        }

        /* ── Google button ── */
        .sc-google-btn {
            width: 100%;
            padding: 10px 14px;
            background: #fff;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 14px;
        }

        .sc-google-btn:hover {
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        .sc-google-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ── Divider ── */
        .sc-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            color: #9ca3af;
            font-size: 0.82rem;
        }

        .sc-divider::before,
        .sc-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
    </style>
</head>

<body>

    <div class="signin-page">
        <div class="signin-card">

            <!-- LEFT: Login form -->
            <div class="sc-form-panel">
                <div class="sc-brand">
                    <div class="sc-brand-icon">
                        <img src="images/tesdalogo.png" alt="MotoMaster" />
                    </div>
                    <span class="sc-brand-name">Tesda</span>
                </div>

                <div class="teacher-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    Teacher Access
                </div>

                <h1 class="sc-title">Teacher Login</h1>
                <p class="sc-subtitle">Sign in to manage your classes and students.</p>

                <div class="sc-error" id="loginError">Invalid email or password.</div>

                <button class="sc-google-btn" id="googleBtn">
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#EA4335"
                            d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.09-6.09C34.46 3.19 29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.22l7.09 5.51C12.4 13.59 17.73 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.14 24.55c0-1.64-.15-3.22-.42-4.75H24v9h12.44c-.54 2.9-2.18 5.36-4.65 7.01l7.19 5.59C43.09 37.19 46.14 31.34 46.14 24.55z" />
                        <path fill="#FBBC05"
                            d="M10.73 28.27A14.6 14.6 0 0 1 9.5 24c0-1.48.26-2.91.73-4.27l-7.09-5.51A23.93 23.93 0 0 0 0 24c0 3.87.93 7.53 2.57 10.76l8.16-6.49z" />
                        <path fill="#34A853"
                            d="M24 47c5.5 0 10.12-1.82 13.49-4.95l-7.19-5.59c-1.82 1.22-4.15 1.94-6.3 1.94-6.27 0-11.6-4.09-13.27-9.73l-8.16 6.49C7.07 41.52 14.82 47 24 47z" />
                    </svg>
                    Continue with Google
                </button>

                <div class="sc-divider">Or sign in with email</div>

                <div class="sc-field">
                    <label for="teacherEmail">Email</label>
                    <input type="email" id="teacherEmail" placeholder="Enter teacher email" autocomplete="email" />
                </div>

                <div class="sc-field">
                    <label for="teacherPass">Password</label>
                    <input type="password" id="teacherPass" placeholder="Enter password"
                        autocomplete="current-password" />
                </div>

                <div class="sc-options">
                    <label>
                        <input type="checkbox" id="showPwd" onchange="togglePwd()" />
                        Show Password
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button class="sc-btn-login" onclick="teacherLogin()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    Login as Teacher
                </button>

                <p class="sc-signup-link">Don't have an account? <a href="teachersignup.html">Sign up</a></p>
            </div>

            <!-- RIGHT: Branding -->
            <div class="sc-right">
                <div class="sc-logo-wrap">
                    <img src="images/finalogo.png" alt="MotoMaster Logo" />
                </div>

                <div class="sc-bottom">
                    <div class="sc-tagline">
                        <h2>MotoMaster Teacher.</h2>
                        <p>Track student progress and manage module content.</p>
                    </div>
                    <a href="index.html" class="sc-back">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Back to Home
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePwd() {
            const p = document.getElementById('teacherPass');
            p.type = document.getElementById('showPwd').checked ? 'text' : 'password';
        }

        async function teacherLogin() {
            const email = document.getElementById('teacherEmail').value.trim();
            const pass = document.getElementById('teacherPass').value;
            const errEl = document.getElementById('loginError');

            if (!email || !pass) {
                errEl.textContent = 'Please enter both email and password.';
                errEl.classList.add('show');
                return;
            }

            try {
                const res = await fetch('login_teacher.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    errEl.classList.remove('show');
                    if (data.teacher) {
                        const serialized = JSON.stringify(data.teacher);
                        sessionStorage.setItem('motomasterTeacher', serialized);
                        localStorage.setItem('motomasterTeacher', serialized);
                    }
                    window.location.href = 'teacherdash.html';
                    return;
                }

                errEl.textContent = data.message || 'Invalid email or password.';
                errEl.classList.add('show');
                if (data.message && data.message.toLowerCase().includes('not registered')) {
                    document.getElementById('teacherEmail').focus();
                } else {
                    document.getElementById('teacherPass').focus();
                }
            } catch (error) {
                errEl.textContent = 'Network or server error.';
                errEl.classList.add('show');
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') teacherLogin();
        });
    </script>

</body>

</html>
